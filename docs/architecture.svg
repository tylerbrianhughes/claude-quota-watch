<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#719b8e"/></marker></defs><rect width="1200" height="650" rx="18" fill="#10191e"/><g font-family="Arial,sans-serif"><text x="45" y="52" font-size="12" fill="#92d2b4" font-weight="bold">QUOTA WATCH</text><text x="45" y="97" font-size="28" fill="#eef4f0" font-weight="bold">Observe cheaply. Wake an agent only when needed.</text><text x="45" y="135" font-size="16" fill="#abc0c7" font-weight="normal">A local dashboard gives continuous visibility without a continuous agent Goal.</text><text x="45" y="193" font-size="12" fill="#92d2b4" font-weight="bold">LOCAL PROGRAMS · NO MODEL INFERENCE</text><rect x="45" y="218" width="240" height="105" rx="12" fill="#1a292e" stroke="#36544a"/><text x="63" y="250" font-size="19" fill="#edf4f0" font-weight="bold">Scheduled monitor</text><text x="63" y="276" font-size="13" fill="#abc0c7" font-weight="normal">Auth + native quota evidence</text><text x="63" y="296" font-size="13" fill="#abc0c7" font-weight="normal">Every 3 minutes locally</text><rect x="335" y="218" width="240" height="105" rx="12" fill="#1a292e" stroke="#36544a"/><text x="353" y="250" font-size="19" fill="#edf4f0" font-weight="bold">Local JSON snapshot</text><text x="353" y="276" font-size="13" fill="#abc0c7" font-weight="normal">Account identity + reading age</text><text x="353" y="296" font-size="13" fill="#abc0c7" font-weight="normal">Capacity, rates, obligations</text><rect x="625" y="218" width="240" height="105" rx="12" fill="#1a292e" stroke="#36544a"/><text x="643" y="250" font-size="19" fill="#edf4f0" font-weight="bold">Fleet dashboard</text><text x="643" y="276" font-size="13" fill="#abc0c7" font-weight="normal">Browser refreshes every 5s</text><text x="643" y="296" font-size="13" fill="#abc0c7" font-weight="normal">No model calls; read-only</text><path d="M285 270H332" fill="none" stroke="#719b8e" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 270H622" fill="none" stroke="#719b8e" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="255" font-size="15" fill="#d5e2dd" font-weight="bold">No material event?</text><text x="915" y="280" font-size="14" fill="#abc0c7" font-weight="normal">Exit until next pass.</text><text x="45" y="390" font-size="12" fill="#efbd83" font-weight="bold">BOUNDED INTERVENTION · USES AGENT QUOTA</text><rect x="45" y="415" width="240" height="105" rx="12" fill="#1a292e" stroke="#715c43"/><text x="63" y="447" font-size="19" fill="#edf4f0" font-weight="bold">Deduplicated incident</text><text x="63" y="473" font-size="13" fill="#abc0c7" font-weight="normal">One registered owner</text><text x="63" y="493" font-size="13" fill="#abc0c7" font-weight="normal">Failed delivery remains retryable</text><rect x="335" y="415" width="240" height="105" rx="12" fill="#1a292e" stroke="#715c43"/><text x="353" y="447" font-size="19" fill="#edf4f0" font-weight="bold">Recovery agent</text><text x="353" y="473" font-size="13" fill="#abc0c7" font-weight="normal">Fresh check; switch if needed</text><text x="353" y="493" font-size="13" fill="#abc0c7" font-weight="normal">Preserve sessions + drafts</text><rect x="625" y="415" width="240" height="105" rx="12" fill="#1a292e" stroke="#715c43"/><text x="643" y="447" font-size="19" fill="#edf4f0" font-weight="bold">Verify &amp; record</text><text x="643" y="473" font-size="13" fill="#abc0c7" font-weight="normal">Live adoption, goals, remote UI</text><text x="643" y="493" font-size="13" fill="#abc0c7" font-weight="normal">Ledger + pending obligations</text><path d="M165 323V410" fill="none" stroke="#719b8e" stroke-width="2" marker-end="url(#arrow)"/><text x="183" y="364" font-size="13" fill="#e2bb91" font-weight="normal">Only actionable events</text><path d="M285 468H332" fill="none" stroke="#719b8e" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 468H622" fill="none" stroke="#719b8e" stroke-width="2" marker-end="url(#arrow)"/><path d="M865 468H898V349H455V326" fill="none" stroke="#719b8e" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="585" font-size="16" fill="#e2ebe7" font-weight="bold">Page refresh is not measurement freshness. Both clocks stay visible.</text><text x="45" y="615" font-size="14" fill="#abc0c7" font-weight="normal">Unknown capacity stays unknown. Forecasts are estimates. Banked resets require explicit authorization.</text></g></svg>